<div class="card-body p-4">
  <div class="text-center mt-2">
    <h5 class="text-primary">Bienvenido</h5>
    <p class="text-muted">Por favor indica tu email y password para ingresar</p>
  </div>
  <div class="p-2 mt-4">
    <form id="form_backoffice_usuario_iniciar_sesion" name="form_backoffice_usuario_iniciar_sesion" method="post">
      <div class="mb-3 input-group-lg">
        <div class="form-line">
          <label for="username" class="form-label">Email</label>
          <input type="email" class="form-control" name="email" id="email" placeholder="Email" required />
        </div>
      </div>

      <div class="mb-3">
        <div class="float-end">
          <a href="#" class="text-muted">¡Olvidaste tú Password!</a>
        </div>
        <label class="form-label" for="password">Password</label>
        <div class="position-relative auth-pass-inputgroup mb-3 input-group-lg">
          <div class="form-line">
            <input type="password" class="form-control pe-5 password-input" placeholder="Password" id="password" name="password" required />
            <button class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted shadow-none password-addon" type="button" id="password-addon">
              <i class="ri-eye-fill align-middle"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="mt-4">
        <button class="btn btn-success w-100" type="submit">Iniciar sesión</button>
      </div>
    </form>
  </div>
</div>
<!-- end card body -->
